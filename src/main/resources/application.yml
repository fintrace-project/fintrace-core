spring:
  application:
    name: fintrace-core

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

jobs:
  cleanWorkspacesBackgroundJob:
    cron: "0 0 3 * * SUN"
    params:
      persistPeriod: 30d

logging:
  pattern:
    correlation: "%X{traceId:-} [user=%X{userId:-}|workspace=%X{workspaceId:-}] "
