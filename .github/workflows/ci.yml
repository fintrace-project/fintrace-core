name: CI

# Path-filtered so a change to docs, or later to the frontend, does not rebuild Core.
on:
  pull_request:
    paths:
      - 'fintrace-core/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'fintrace-core/**'
      - 'deploy/Dockerfile'
      - '.github/workflows/ci.yml'

# A second push to the same branch cancels the first: the older answer is no longer interesting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: fintrace-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # `clean`, per CLAUDE.md: an incremental build has twice hidden a compile error in the tests.
      # Testcontainers needs a Docker daemon, which ubuntu-latest runners provide.
      - name: Test
        working-directory: fintrace-core
        run: ./gradlew --no-daemon clean test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            fintrace-core/build/reports/tests/test
            fintrace-core/build/test-results/test
          retention-days: 7
